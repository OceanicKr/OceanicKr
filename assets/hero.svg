<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#160202"/><stop offset=".45" stop-color="#6b0f0a"/>
    <stop offset=".8" stop-color="#d9330f"/><stop offset="1" stop-color="#ff8a3d"/>
  </linearGradient>
  <radialGradient id="sun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffe3a3"/><stop offset=".6" stop-color="#ffab4a"/><stop offset="1" stop-color="#ff6a1f"/>
  </radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ff8a3d" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
  </radialGradient>
  <style>
    .w { animation: drift linear infinite; }
    .w1 { animation-duration: 30s; } .w2 { animation-duration: 22s; animation-direction: reverse; }
    .w3 { animation-duration: 16s; } .w4 { animation-duration: 12s; animation-direction: reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    .sh { animation: shimmer 2.5s ease-in-out infinite; opacity: .5; }
    @keyframes shimmer { 0%,100% { opacity: .15; } 50% { opacity: .75; } }
    .flare { transform-origin: 1093px 144px; animation: flick .35s ease-in-out infinite alternate; }
    @keyframes flick { from { transform: scale(.85,.9); } to { transform: scale(1.1,1.15) skewX(-4deg); } }
    .beacon { animation: blink 1.6s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .t1 { font: 800 84px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 14px; fill: #ffe6cc; }
    .t2 { font: 500 26px 'Noto Sans Devanagari', 'Nirmala UI', 'Mangal', 'Segoe UI', sans-serif; fill: #ffc999; }
    .t3 { font: 500 15px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; letter-spacing: 3px; fill: #ffb380; }
    .fade { animation: fin 2.5s ease-out both; }
    @keyframes fin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <clipPath id="above"><rect width="1200" height="284"/></clipPath>
</defs>
<rect width="1200" height="420" fill="url(#sky)"/>
<circle cx="915" cy="250" r="260" fill="url(#glow)"/>
<circle cx="915" cy="250" r="100" fill="url(#sun)" clip-path="url(#above)"/>

